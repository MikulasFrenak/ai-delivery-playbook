# Checks every PR to main, then gives it a testing deploy of the MCP server at its own address. A merge to main is
# checked the same way, then deployed to the real server. See docs/ci.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a PR replaces its running check; runs on main always finish, so each merge deploys.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: MCP tests, skill rules, links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Stdio server
        run: node mcp-server/test.js
      - name: Remote worker, built from skills/
        working-directory: mcp-server/remote
        run: node build.js && node test.js
      - name: Skill frontmatter, registration and relative links
        run: node .github/scripts/check-docs.mjs && node --test .github/scripts/check-docs.test.mjs
      - name: Keep the checked bundle for the deploys
        uses: actions/upload-artifact@v7
        with:
          name: skills-data
          path: mcp-server/remote/skills-data.js
          retention-days: 7

  testing:
    name: Testing deploy (this PR's own address)
    needs: check
    # Same-repo PRs only: a fork's PR gets no secrets, and its code shouldn't reach a deploy.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: testing-deploy-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: testing
      url: ${{ steps.upload.outputs.url }}/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: skills-data
          path: mcp-server/remote
      # A preview version with its own alias URL; the real server keeps serving its current deployment.
      - name: Upload the checked bundle as a preview version
        id: upload
        working-directory: mcp-server/remote
        shell: bash
        run: |
          npx --yes wrangler@4.156.0 versions upload --preview-alias "pr-${PR}" --message "PR #${PR} ${GITHUB_SHA::7}" | tee upload.log
          url="$(grep -oE "https://pr-${PR}-[a-z0-9.-]+\.workers\.dev" upload.log | head -1)"
          if [ -z "$url" ]; then echo "::error::No preview URL in wrangler's output. Turn on Preview URLs for the worker (docs/ci.md)."; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          PR: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test the testing server
        shell: bash
        run: |
          .github/scripts/smoke-test.sh "$URL/mcp"
          echo "Testing server for this PR: $URL/mcp" >> "$GITHUB_STEP_SUMMARY"
        env:
          URL: ${{ steps.upload.outputs.url }}

  deploy:
    name: Deploy to the real server
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://ai-delivery-playbook.mikulas-frenak.workers.dev/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: skills-data
          path: mcp-server/remote
      - name: Deploy the checked bundle
        working-directory: mcp-server/remote
        run: npx --yes wrangler@4.156.0 deploy --message "$(git log -1 --pretty=%s)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke-test the real server
        run: .github/scripts/smoke-test.sh https://ai-delivery-playbook.mikulas-frenak.workers.dev/mcp
